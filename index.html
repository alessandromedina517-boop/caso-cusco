<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<title>Un álbum para Larry 📷</title>
<meta property="og:title" content="Un álbum para Larry 📷">
<meta property="og:description" content="Desde Cusco, con cariño. Ábrelo con calma.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alessandromedina517-boop.github.io/caso-cusco/">
<meta property="og:image" content="https://alessandromedina517-boop.github.io/caso-cusco/bebe.jpg">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#1c2620;--tapa:#2f4a3a;--oro:#e3c77a;--papel:#fbf6ea;--tinta:#33302a;--acento:#b5553c;--verde:#4f7a5c}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 50% 0,#2c3a31,var(--fondo) 70%) fixed;color:var(--tinta);font-family:'Lora',Georgia,serif;min-height:100vh;min-height:100dvh;display:flex;padding:30px 16px;overflow-x:hidden}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes temblar{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pegar{to{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
@keyframes caer{to{transform:translateY(110vh) rotate(40deg);opacity:.2}}

/* Tapa del álbum */
.tapa{margin:auto;width:100%;max-width:380px;aspect-ratio:3/4;background:linear-gradient(135deg,#3a5a46,var(--tapa) 60%,#253b2e);border-radius:6px 14px 14px 6px;box-shadow:0 22px 50px rgba(0,0,0,.6),inset 14px 0 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--oro);animation:entra .8s ease both;position:relative}
.tapa::after{content:"";position:absolute;inset:18px 18px 18px 30px;border:1.5px solid rgba(227,199,122,.45);border-radius:4px;pointer-events:none}
.tapa .titulo{font-family:'Caveat',cursive;font-size:3.4rem;line-height:1}
.tapa .para{font-size:1.15rem;margin:18px 0 4px}
.tapa .de{opacity:.75;font-size:.95rem;margin-bottom:34px}
.tapa .btn{background:var(--oro);color:var(--tapa);border-color:var(--oro);position:relative;z-index:1}

/* Páginas */
.hoja{margin:auto;width:100%;max-width:440px;background:var(--papel);border-radius:4px;padding:32px 22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.55);position:relative;text-align:center;animation:entra .6s ease both}
.barras{position:absolute;top:12px;left:14px;right:14px;display:flex;gap:4px}
.barras i{flex:1;height:3px;border-radius:2px;background:rgba(51,48,42,.12)}
.barras i.on{background:var(--acento)}
.adorno{color:var(--acento);font-size:1.1rem;margin:6px 0 8px}
h2{font-family:'Caveat',cursive;font-size:2.2rem;font-weight:700;margin-bottom:8px}
.etq{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--acento);margin:6px 0 14px}
.texto{font-size:1.05rem;line-height:1.6;min-height:3.2em;margin:16px 0 10px;cursor:pointer}
.foto{position:relative;display:inline-block;background:#fff;padding:8px 8px 36px;box-shadow:0 10px 24px rgba(0,0,0,.2);transform:rotate(-2deg);max-width:88%}
.foto::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(181,85,60,.35);transform:rotate(3deg)}
.foto img{display:block;width:100%;max-height:320px;object-fit:cover}
.foto figcaption{position:absolute;bottom:6px;left:0;right:0;font-family:'Caveat',cursive;font-size:1.35rem}
.preg{font-size:1.1rem;font-weight:600;margin:6px 0 10px}
.ops{display:flex;flex-direction:column;gap:8px}
.op{font:inherit;font-size:1rem;background:#fff;border:2px solid #d9cfbd;border-radius:10px;padding:11px;cursor:pointer;color:var(--tinta)}
.op.bien{background:var(--verde);border-color:var(--verde);color:#fff}
.op.mal{border-color:var(--acento);color:var(--acento);opacity:.6;animation:temblar .35s}
#resp{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--acento);min-height:1.5em;margin-top:10px}
.btn{display:inline-block;font:inherit;font-size:1rem;text-decoration:none;background:var(--tapa);color:var(--papel);border:2px solid var(--tapa);border-radius:999px;padding:12px 28px;margin:8px 4px 0;cursor:pointer}
.btn.pulsa{animation:latir 1.4s infinite}
.btn.sec{background:transparent;color:var(--tapa)}
.oculto{display:none!important}

/* La foto que falta */
.marco{position:relative;width:100%;aspect-ratio:4/3;background:#111;border:8px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.25);overflow:hidden}
.marco img{width:100%;height:100%;object-fit:contain;display:block}
#raspa{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s ease}
.sticker{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0;background:var(--oro);color:var(--tapa);font-family:'Caveat',cursive;font-weight:700;font-size:1.8rem;padding:6px 20px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none}
.sticker.on{animation:pegar .5s cubic-bezier(.3,1.4,.5,1) forwards}

/* Final */
.tio{font-family:'Caveat',cursive;font-size:3.2rem;color:var(--acento);line-height:1.1;margin:4px 0 8px}
.sub{font-size:1.05rem;line-height:1.55;margin-bottom:10px}
.cuenta{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--verde);margin-bottom:6px}
.carta{font-family:'Caveat',cursive;font-size:1.4rem;line-height:1.35;text-align:left;background:#fff;padding:18px;margin:14px 0 10px;border-radius:4px;box-shadow:0 6px 18px rgba(51,48,42,.15);transform:rotate(-.6deg);white-space:pre-line}
.firma{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--acento);margin-bottom:18px}
.lluvia{position:fixed;top:-40px;pointer-events:none;z-index:9;animation:caer linear forwards}
</style>
</head>
<body>

<section class="tapa" id="intro">
  <p class="titulo">Recuerdos</p>
  <p class="para" id="pPara"></p>
  <p class="de">Desde Cusco, con cariño</p>
  <button class="btn pulsa" id="abrir">Abrir el álbum 📷</button>
</section>

<main id="album" class="oculto" style="margin:auto;width:100%;max-width:440px"></main>
<audio id="musica" src="cancion.mp3" loop></audio>

<script>
const C = {
  hermano: "Larry",
  yo: "Nerito",
  novia: "Mary Cielo",
  perro: "Drako",
  mesParto: "mayo de 2027",
  fechaParto: "2027-05-23",
  whatsapp: "51983095706",
  carta: `{H}:

En esa foto yo era un bebé y tú ya me cargabas con esa sonrisa. No me acuerdo de ese día, pero sí de todo lo que vino después: cada vez que necesité a alguien, estabas.

Estuviste el día de mi ascenso, en las salidas, en todo. Ahora tú estás en Lima y yo en Cusco, pero quería que te enteraras así, con nuestras fotos.

Ahora te toca a ti cargar a un bebé otra vez.`
};

const pasos = [
  {tipo:"texto", titulo:"Un álbum para ti",
   texto:"{H}, desde Cusco te mando unos recuerdos. Mira cada foto con calma y responde lo que te pregunte.",
   boton:"Empezar"},
  {tipo:"foto", etq:"Recuerdo 1", foto:"bebe.jpg", pie:"Hace muchos años…",
   texto:"Un joven muy sonriente carga a un bebé vestido de marinerito.",
   pregunta:"¿Quién es ese bebé?",
   opciones:[["Mi hermanito",1],["Un sobrino",0],["Ni idea",0]],
   ok:"Sí, era yo. Y tú ya me estabas cuidando.",
   mal:"Mírale bien los cachetes… ¡era yo! 😄"},
  {tipo:"foto", etq:"Recuerdo 2", foto:"ascenso.jpg", pie:"El día de mi ascenso",
   texto:"Ese bebé creció… y se hizo policía.",
   pregunta:"¿Quién estaba a su lado ese día?",
   opciones:[["Yo, obvio",1],["Nadie",0],["Un desconocido",0]],
   ok:"Exacto. Como siempre, ahí estabas.",
   mal:"Mira la foto otra vez 😏"},
  {tipo:"foto", etq:"Recuerdo 3", foto:"salida.jpg", pie:"Una noche cualquiera",
   texto:"Y aunque ahora nos separen más de mil kilómetros entre Lima y Cusco, seguimos siendo los mismos.",
   boton:"Pasar la página"},
  {tipo:"texto", titulo:"Una página más",
   texto:"Esta página del álbum todavía está vacía. La historia se repite: el que una vez cargó a un bebé… pronto va a cargar a otro.",
   boton:"Ver la foto que falta"},
  {tipo:"raspa"},
  {tipo:"final"}
];

const $ = id => document.getElementById(id);
const t = s => s.replaceAll("{H}", C.hermano);
let paso = 0, tecla;

$("pPara").textContent = "Para " + C.hermano;
pasos.forEach(p => { if (p.foto) new Image().src = p.foto; });
new Image().src = "ecografia.jpg";

function escribir(el, txt, fin){
  clearInterval(tecla);
  let n = 0;
  el.textContent = "";
  tecla = setInterval(() => {
    el.textContent = txt.slice(0, ++n);
    if (n >= txt.length) { clearInterval(tecla); fin && fin(); }
  }, 38);
  el.onclick = () => {
    if (n < txt.length) { clearInterval(tecla); n = txt.length; el.textContent = txt; fin && fin(); }
  };
}

function mostrar(i){
  paso = i;
  window.scrollTo(0, 0);
  const p = pasos[i];
  let h = `<div class="barras">${pasos.map((_, n) => `<i class="${n <= i ? "on" : ""}"></i>`).join("")}</div>`;

  if (p.tipo === "texto") {
    h += `<p class="adorno">♥</p><h2>${t(p.titulo)}</h2>
          <p class="texto" id="txt"></p>
          <button class="btn oculto" id="sig">${p.boton}</button>`;
  }
  if (p.tipo === "foto") {
    h += `<p class="etq">${p.etq}</p>
          <figure class="foto"><img src="${p.foto}" alt=""><figcaption>${p.pie}</figcaption></figure>
          <p class="texto" id="txt"></p>
          <div id="preg" class="oculto">${p.pregunta ? `<p class="preg">${p.pregunta}</p><div class="ops" id="ops"></div><p id="resp"></p>` : ""}</div>
          <button class="btn oculto" id="sig">${p.boton || "Siguiente recuerdo"}</button>`;
  }
  if (p.tipo === "raspa") {
    h += `<p class="etq">La foto que falta</p>
          <div class="marco"><img src="ecografia.jpg" alt=""><canvas id="raspa"></canvas><span class="sticker" id="sticker">♥ Nuevo integrante ♥</span></div>
          <p class="texto">Raspa con tu dedo para verla.</p>`;
  }
  if (p.tipo === "final") {
    const dias = Math.ceil((new Date(C.fechaParto + "T00:00:00") - new Date()) / 864e5);
    const wa = "https://wa.me/" + C.whatsapp + "?text=";
    h += `<p class="adorno">♥ ♥ ♥</p>
          <h1 class="tio">¡Vas a ser tío!</h1>
          <p class="sub">${C.yo} y ${C.novia} vamos a ser papás.<br>Y ${C.perro} va a ser hermano mayor.</p>
          <p class="cuenta">Llega en ${C.mesParto}${dias > 0 ? ` · faltan unos ${dias} días` : ""}</p>
          <div class="carta">${t(C.carta)}</div>
          <p class="firma">Tu ${C.yo}, ${C.novia} y ${C.perro}</p>
          <p class="preg">¿Qué crees que será?</p>
          <a class="btn" target="_blank" rel="noopener" href="${wa + encodeURIComponent("¡Ya vi el álbum! 😭💛 Yo digo que será niño 💙")}">Niño 💙</a>
          <a class="btn" target="_blank" rel="noopener" href="${wa + encodeURIComponent("¡Ya vi el álbum! 😭💛 Yo digo que será niña 💗")}">Niña 💗</a>
          <p><button class="btn sec" id="otra">Ver de nuevo</button></p>`;
  }

  $("album").innerHTML = `<article class="hoja">${h}</article>`;

  if (p.tipo === "texto" || p.tipo === "foto") {
    escribir($("txt"), t(p.texto), () => {
      if (p.pregunta) { $("preg").classList.remove("oculto"); opciones(p); }
      else $("sig").classList.remove("oculto");
    });
    $("sig").onclick = () => mostrar(i + 1);
  }
  if (p.tipo === "raspa") requestAnimationFrame(prepararRaspa);
  if (p.tipo === "final") {
    lluvia();
    if (navigator.vibrate) navigator.vibrate([80, 60, 160]);
    $("otra").onclick = () => mostrar(0);
  }
}

function opciones(p){
  const box = $("ops");
  p.opciones.forEach(([txt, bien]) => {
    const b = document.createElement("button");
    b.className = "op";
    b.textContent = txt;
    b.onclick = () => {
      if (bien) {
        b.classList.add("bien");
        box.querySelectorAll("button").forEach(x => x.disabled = true);
        $("resp").textContent = p.ok;
        $("sig").classList.remove("oculto");
      } else {
        b.classList.add("mal");
        b.disabled = true;
        $("resp").textContent = p.mal;
        if (navigator.vibrate) navigator.vibrate(60);
      }
    };
    box.appendChild(b);
  });
}

function prepararRaspa(){
  const cv = $("raspa"), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0, 0, cv.width, cv.height);
  g.addColorStop(0, "#c9a45c"); g.addColorStop(.5, "#ecd49a"); g.addColorStop(1, "#b8873a");
  x.fillStyle = g;
  x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = "rgba(255,255,255,.3)";
  for (let n = 0; n < 50; n++) {
    x.font = `${(12 + Math.random() * 16) * dpr}px serif`;
    x.fillText("♥", Math.random() * cv.width, Math.random() * cv.height);
  }
  x.fillStyle = "#4a3412";
  x.textAlign = "center";
  x.font = `700 ${32 * dpr}px Caveat, cursive`;
  x.fillText("Raspa aquí", cv.width / 2, cv.height / 2);
  x.font = `${15 * dpr}px Lora, Georgia, serif`;
  x.fillText("la foto que falta", cv.width / 2, cv.height / 2 + 28 * dpr);

  let on = false, listo = false, lx = 0, ly = 0;
  const pt = e => { const r = cv.getBoundingClientRect(), d = cv.width / r.width; return [(e.clientX - r.left) * d, (e.clientY - r.top) * d]; };
  const raspar = e => {
    const [px, py] = pt(e);
    x.globalCompositeOperation = "destination-out";
    x.lineWidth = cv.width * .14;
    x.lineCap = "round";
    x.beginPath(); x.moveTo(lx, ly); x.lineTo(px + .1, py + .1); x.stroke();
    lx = px; ly = py;
  };
  const destapado = () => {
    const d = x.getImageData(0, 0, cv.width, cv.height).data;
    let total = 0, vacio = 0;
    for (let k = 3; k < d.length; k += 4 * 23) { total++; if (d[k] === 0) vacio++; }
    return vacio / total;
  };
  cv.onpointerdown = e => {
    if (listo) return;
    on = true; [lx, ly] = pt(e);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    raspar(e);
  };
  cv.onpointermove = e => { if (on) raspar(e); };
  cv.onpointerup = cv.onpointercancel = () => {
    if (!on) return;
    on = false;
    if (destapado() > .35) {
      listo = true;
      cv.style.opacity = 0;
      setTimeout(() => {
        $("sticker").classList.add("on");
        if (navigator.vibrate) navigator.vibrate(150);
      }, 900);
      setTimeout(() => mostrar(paso + 1), 3200);
    }
  };
}

function lluvia(){
