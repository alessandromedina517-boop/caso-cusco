<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<title>Un viaje para Larry 🚌</title>
<meta property="og:title" content="Un viaje para Larry 🚌">
<meta property="og:description" content="De Cusco a Lima, con una encomienda muy especial. Sube el volumen.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alessandromedina517-boop.github.io/caso-cusco/">
<meta property="og:image" content="https://alessandromedina517-boop.github.io/caso-cusco/bebe.jpg">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#14171f;--papel:#fbf6ea;--tinta:#33302a;--acento:#c0532f;--oro:#e8a33d;--verde:#4f7a5c}
*{box-sizing:border-box;margin:0}
body{background:var(--fondo);color:var(--tinta);font-family:'Baloo 2',system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;padding:20px 12px;overflow-x:hidden}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes correr{to{transform:translateX(-50%)}}
@keyframes bote{50%{transform:translateY(-2px)}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes volar{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
@keyframes caer{to{transform:translateY(110vh) rotate(40deg);opacity:.2}}
@keyframes titilar{50%{opacity:.3}}

.boleto{margin:auto;width:100%;max-width:360px;background:#fff8e7;border-radius:14px;padding:26px 22px 24px;text-align:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:entra .8s ease both}
.boleto::before,.boleto::after{content:"";position:absolute;top:118px;width:24px;height:24px;border-radius:50%;background:var(--fondo)}
.boleto::before{left:-12px}.boleto::after{right:-12px}
.emp{font-size:.8rem;letter-spacing:.3em;color:var(--acento);font-weight:700}
.trayecto{font-size:2rem;font-weight:700;line-height:1.2;margin:6px 0 18px}
.trayecto span{color:var(--oro)}
.filas{border-top:2px dashed #d9cdb3;padding-top:16px;margin-bottom:20px;text-align:left;display:grid;gap:10px}
.filas small{display:block;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;opacity:.55}
.filas b{font-size:1.1rem}
.nota{font-size:.85rem;opacity:.55;margin-top:12px}

#viaje{margin:auto;width:100%;max-width:460px;animation:entra .8s ease both}
.ruta{position:relative;height:50px;margin:0 22px 6px}
.linea{position:absolute;top:13px;left:0;right:0;height:4px;background:rgba(255,255,255,.18);border-radius:2px}
.avance{height:100%;width:0;background:var(--oro);border-radius:2px;transition:width 5.5s linear}
.parada{position:absolute;top:8px;transform:translateX(-50%);text-align:center;color:#fff}
.parada i{display:block;width:14px;height:14px;margin:0 auto 3px;border-radius:50%;background:#3a3f4f;border:2px solid #fff}
.parada.on i{background:var(--oro)}
.parada span{font-size:.72rem;opacity:.8}
.busito{position:absolute;top:6px;left:0;width:20px;height:18px;transform:translateX(-50%);background:var(--oro);border:2px solid #fff;border-radius:5px;transition:left 5.5s linear;z-index:2}

.escena{position:relative;height:280px;overflow:hidden;border-radius:14px 14px 0 0}
.cielo{position:absolute;inset:0;opacity:0;transition:opacity 2s}
.c-sierra{background:linear-gradient(#7fc3e8,#d8eef5)}
.c-desierto{background:linear-gradient(#e98b5a,#fbe0b0)}
.c-costa{background:linear-gradient(#9aa7b4,#dfe3e6)}
.c-noche{background:linear-gradient(#0f1533,#3b3560)}
.escena.sierra .c-sierra,.escena.desierto .c-desierto,.escena.costa .c-costa,.escena.noche .c-noche{opacity:1}
.estrellas{position:absolute;left:0;right:0;top:0;height:150px;opacity:0;transition:opacity 2s}
.escena.noche .estrellas{opacity:1}
.estrellas i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.estrellas i:nth-child(3n){animation:titilar 2.4s infinite}
.astro{position:absolute;top:26px;left:76%;width:38px;height:38px;border-radius:50%;background:#ffd75e;box-shadow:0 0 24px #ffd75e88;transition:all 2s}
.escena.desierto .astro{top:74px;background:#ff9a5a;box-shadow:0 0 30px #ff9a5a99}
.escena.costa .astro{background:#fff;opacity:.35;box-shadow:none}
.escena.noche .astro{left:12%;top:24px;background:#f4f1de;box-shadow:0 0 22px #ffffff66;opacity:1}
.capa{position:absolute;left:0;width:200%;display:flex;animation:correr var(--v) linear infinite;transition:opacity 2s}
.capa svg{width:50%;height:100%;display:block}
.t-sierra,.t-desierto,.t-costa,.t-noche{opacity:0}
.escena.sierra .t-sierra,.escena.desierto .t-desierto,.escena.costa .t-costa,.escena.noche .t-noche{opacity:1}
.escena.parado .capa{animation-play-state:paused}
.bus{position:absolute;left:12%;bottom:20px;width:150px;z-index:3}
.bus svg{display:block;width:100%}
.escena:not(.parado) .bus svg{animation:bote .4s ease-in-out infinite}
.rueda{transform-box:fill-box;transform-origin:center}
.escena:not(.parado) .rueda{animation:girar .5s linear infinite}
.caja{position:absolute;left:66%;bottom:22px;width:80px;padding:0;border:0;background:none;cursor:pointer;z-index:3;animation:latir 1.1s infinite}
.caja svg{display:block;width:100%}
#tapa{transform-box:fill-box;transform-origin:0 100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.caja.abierta{animation:none}
.caja.abierta #tapa{transform:translate(-4px,-30px) rotate(-30deg)}
.chispa{position:absolute;z-index:4;pointer-events:none;animation:volar 1.7s ease-out forwards}

.panel{background:var(--papel);padding:22px 22px 28px;text-align:center;min-height:300px;border-radius:0 0 14px 14px}
.lugar{font-weight:700;font-size:1.35rem;color:var(--acento);margin-bottom:12px}
.texto{font-size:1.12rem;line-height:1.5;min-height:3em;margin:14px 0 8px;cursor:pointer}
.foto{position:relative;display:inline-block;background:#fff;padding:8px 8px 34px;box-shadow:0 10px 24px rgba(0,0,0,.2);transform:rotate(-2deg);max-width:86%;animation:entra .7s ease both}
.foto img{display:block;width:100%;max-height:300px;object-fit:cover}
.foto.eco img{object-fit:contain;background:#111}
.foto figcaption{position:absolute;bottom:4px;left:0;right:0;font-family:'Caveat',cursive;font-size:1.35rem}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:1.05rem;text-decoration:none;background:var(--acento);color:#fff;border:2px solid var(--acento);border-radius:999px;padding:11px 28px;margin:8px 4px 0;cursor:pointer}
.btn.pulsa{animation:latir 1.4s infinite}
.btn.sec{background:transparent;color:var(--acento)}
.oculto{display:none!important}
.tio{font-family:'Caveat',cursive;font-size:3.2rem;color:var(--acento);line-height:1.05;margin:16px 0 6px}
.sub{font-size:1.1rem;line-height:1.5;margin-bottom:8px}
.cuenta{font-family:'Caveat',cursive;font-size:1.55rem;color:var(--verde)}
.carta{font-family:'Caveat',cursive;font-size:1.4rem;line-height:1.35;text-align:left;background:#fff;padding:18px;margin:16px 0 10px;border-radius:6px;box-shadow:0 6px 18px rgba(51,48,42,.15);transform:rotate(-.6deg);white-space:pre-line}
.firma{font-family:'Caveat',cursive;font-size:1.5rem;color:var(--acento);margin-bottom:16px}
.preg{font-weight:700;font-size:1.1rem;margin-top:6px}
.lluvia{position:fixed;top:-40px;pointer-events:none;z-index:9;animation:caer linear forwards}
</style>
</head>
<body>

<section class="boleto" id="intro">
  <p class="emp">EXPRESO HERMANOS</p>
  <p class="trayecto">CUSCO <span>→</span> LIMA</p>
  <div class="filas">
    <div><small>Pasajero</small><b id="pasajero"></b></div>
    <div><small>Asiento</small><b>1 · El de la ventana</b></div>
    <div><small>Equipaje</small><b>1 encomienda muy especial</b></div>
  </div>
  <button class="btn pulsa" id="subir">Subir al bus 🚌</button>
  <p class="nota">Sube el volumen</p>
</section>

<main id="viaje" class="oculto">
  <div class="ruta">
    <div class="linea"><div class="avance" id="avance"></div></div>
    <div id="paradas"></div>
    <div class="busito" id="busito"></div>
  </div>
  <div class="escena sierra parado" id="escena">
    <div class="cielo c-sierra"></div><div class="cielo c-desierto"></div>
    <div class="cielo c-costa"></div><div class="cielo c-noche"></div>
    <div class="estrellas" id="estrellas"></div>
    <div class="astro"></div>
    <div id="capas"></div>
    <div class="bus">
      <svg viewBox="0 0 150 72" aria-hidden="true">
        <rect x="4" y="6" width="140" height="48" rx="10" fill="#e8a33d"/>
        <rect x="4" y="38" width="140" height="6" fill="#c0532f"/>
        <rect x="14" y="12" width="22" height="18" rx="3" fill="#bfe3f2"/>
        <rect x="40" y="12" width="22" height="18" rx="3" fill="#bfe3f2"/>
        <rect x="66" y="12" width="22" height="18" rx="3" fill="#bfe3f2"/>
        <rect x="92" y="12" width="22" height="18" rx="3" fill="#bfe3f2"/>
        <circle cx="103" cy="24" r="5" fill="#c98d67"/>
        <path d="M98 22a5 5 0 0 1 10 0c-2-2-8-2-10 0z" fill="#2b2020"/>
        <rect x="117" y="14" width="9" height="30" rx="2" fill="#d38b2c"/>
        <rect x="129" y="12" width="13" height="24" rx="4" fill="#bfe3f2"/>
        <circle cx="141" cy="47" r="3" fill="#fff6c0"/>
        <g class="rueda"><circle cx="34" cy="56" r="11" fill="#222"/><circle cx="34" cy="56" r="4" fill="#aaa"/><path d="M34 47v18M25 56h18" stroke="#666" stroke-width="2"/></g>
        <g class="rueda"><circle cx="112" cy="56" r="11" fill="#222"/><circle cx="112" cy="56" r="4" fill="#aaa"/><path d="M112 47v18M103 56h18" stroke="#666" stroke-width="2"/></g>
      </svg>
    </div>
    <button class="caja oculto" id="caja" aria-label="Abrir la encomienda">
      <svg viewBox="0 0 80 72" aria-hidden="true">
        <rect x="6" y="26" width="68" height="44" rx="3" fill="#c89b5e"/>
        <rect x="36" y="26" width="8" height="44" fill="#e8d3a8"/>
        <text x="16" y="56" font-size="16" fill="#c0532f">♥</text>
        <g id="tapa"><rect x="2" y="14" width="76" height="14" rx="3" fill="#b5864c"/><rect x="36" y="14" width="8" height="14" fill="#e8d3a8"/></g>
      </svg>
    </button>
  </div>
  <div class="panel" id="panel"></div>
</main>

<audio id="musica" src="cancion.mp3" loop></audio>

<script>
const C = {
  hermano: "Larry",
  yo: "Nerito",
  novia: "Mary Cielo",
  perro: "Drako",
  mesParto: "mayo de 2027",
  fechaParto: "2027-05-23",
  whatsapp: "51983095706",
  carta: `{H}:

En esa foto yo era un bebé y tú ya me cargabas con esa sonrisa. No me acuerdo de ese día, pero sí de todo lo que vino después: cada vez que necesité a alguien, estabas.

Estuviste el día de mi ascenso, en las salidas, en todo. Ahora tú estás en Lima y yo en Cusco, pero quería que te enteraras así, con este viajecito de Cusco a Lima.

Ahora te toca a ti cargar a un bebé otra vez.`
};

const tramos = [
  {lugar:"Cusco", pos:0, foto:"bebe.jpg", pie:"Hace muchos años…",
   texto:"Aquí empezó todo. Yo era un bebé y tú ya me cargabas con esa sonrisa."},
  {lugar:"Abancay", pos:33, foto:"ascenso.jpg", pie:"El día de mi ascenso", camino:"Subiendo por la sierra…",
   texto:"Ese bebé creció y se hizo policía. Y el día de mi ascenso, como siempre, ahí estabas."},
  {lugar:"Nazca", pos:66, foto:"salida.jpg", pie:"Una noche cualquiera", camino:"Bajando hacia el desierto…", escena:"desierto",
   texto:"Y aunque ahora nos separen más de mil kilómetros, seguimos siendo los mismos."},
  {lugar:"Lima", pos:100, llegada:true, camino:"Ya se ve el mar…",
   texto:"{H}, llegamos a Lima. Hay una encomienda para ti. Tócala para abrirla."}
];

const DUR = 5500;
const $ = id => document.getElementById(id);
const t = s => s.replaceAll("{H}", C.hermano);
let tecla;

$("pasajero").textContent = C.hermano;
tramos.forEach(s => { if (s.foto) new Image().src = s.foto; });
new Image().src = "ecografia.jpg";

$("paradas").innerHTML = tramos.map(s => `<div class="parada" style="left:${s.pos}%"><i></i><span>${s.lugar}</span></div>`).join("");

let est = "";
for (let n = 0; n < 45; n++) est += `<i style="left:${Math.random() * 100}%;top:${Math.random() * 100}%"></i>`;
$("estrellas").innerHTML = est;

let ciudad = "";
for (let x = 0; x < 400; x += 26) {
  const h = 30 + Math.random() * 60, w = 20 + Math.random() * 6;
  ciudad += `<rect x="${x}" y="${100 - h}" width="${w}" height="${h}" fill="#262b45"/>`;
  for (let wy = 104 - h; wy < 95; wy += 9)
    for (let wx = x + 4; wx < x + w - 4; wx += 7)
      if (Math.random() > .45) ciudad += `<rect x="${wx}" y="${wy}" width="3" height="4" fill="#ffd76a"/>`;
}
let rayas = "";
for (let x = 0; x < 400; x += 50) rayas += `<rect x="${x}" y="30" width="26" height="4" fill="#f1d26a"/>`;

const capas = [
  {c:"t-sierra",   v:"70s", b:55, h:140, vb:"0 0 400 120", d:`<path d="M0 120V70L40 30 80 65 120 20 170 70 210 35 260 75 300 25 350 60 400 70V120Z" fill="#7c9a86"/><path d="M40 30l-8 10h16zM120 20l-9 12h18zM300 25l-9 11h18z" fill="#fff" opacity=".85"/>`},
  {c:"t-sierra",   v:"30s", b:55, h:95,  vb:"0 0 400 120", d:`<path d="M0 120V90L50 55 90 85 140 50 190 90 240 60 290 95 340 55 400 90V120Z" fill="#4f7a5c"/>`},
  {c:"t-desierto", v:"45s", b:55, h:110, vb:"0 0 400 120", d:`<path d="M0 120V80L60 50 120 75 190 40 250 78 320 52 400 80V120Z" fill="#c98f5a"/>`},
  {c:"t-desierto", v:"18s", b:55, h:60,  vb:"0 0 400 80",  d:`<path d="M0 80V50Q50 20 100 45T200 40T300 45T400 50V80Z" fill="#e6b877"/>`},
  {c:"t-costa",    v:"30s", b:55, h:45,  vb:"0 0 400 40",  d:`<rect y="8" width="400" height="32" fill="#5f8fa8"/><path d="M0 10q25-8 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>`},
  {c:"t-noche",    v:"26s", b:55, h:110, vb:"0 0 400 100", d:ciudad},
  {c:"",           v:"1.1s",b:0,  h:60,  vb:"0 0 400 60",  d:`<rect width="400" height="60" fill="#4a4a4f"/><rect width="400" height="4" fill="#8a8a8a"/>${rayas}`}
];
$("capas").innerHTML = capas.map(k => {
  const s = `<svg viewBox="${k.vb}" preserveAspectRatio="none">${k.d}</svg>`;
  return `<div class="capa ${k.c}" style="--v:${k.v};bottom:${k.b}px;height:${k.h}px">${s}${s}</div>`;
}).join("");

function setEscena(n){
  const e = $("escena");
  ["sierra", "desierto", "costa", "noche"].forEach(c => e.classList.toggle(c, c === n));
}

function escribir(el, txt, fin){
  clearInterval(tecla);
  let n = 0;
  el.textContent = "";
  tecla = setInterval(() => {
    el.textContent = txt.slice(0, ++n);
    if (n >= txt.length) { clearInterval(tecla); fin && fin(); }
  }, 36);
  el.onclick = () => {
    if (n < txt.length) { clearInterval(tecla); n = txt.length; el.textContent = txt; fin && fin(); }
  };
}

function marcar(i){
  document.querySelectorAll(".parada").forEach((p, n) => p.classList.toggle("on", n <= i));
}

function parada(i){
  const s = tramos[i];
  marcar(i);
  if (s.llegada) {
    $("panel").innerHTML = `<p class="lugar">📍 ${s.lugar}</p><p class="texto" id="txt"></p>`;
    $("caja").classList.remove("oculto");
    escribir($("txt"), t(s.texto));
    return;
  }
  $("panel").innerHTML = `<p class="lugar">📍 ${s.lugar}</p>
    <figure class="foto"><img src="${s.foto}" alt=""><figcaption>${s.pie}</figcaption></figure>
    <p class="texto" id="txt"></p>
    <button class="btn oculto" id="sig">${i === 0 ? "Arrancar 🚌" : "Seguir el viaje 🚌"}</button>`;
  escribir($("txt"), t(s.texto), () => $("sig").classList.remove("oculto"));
  $("sig").onclick = () => viajar(i + 1);
}

function viajar(i){
  const d = tramos[i], e = $("escena");
  $("panel").innerHTML = `<p class="lugar">Rumbo a ${d.lugar}</p><p class="texto">${d.camino}</p>`;
  e.classList.remove("parado");
  $("avance").style.width = d.pos + "%";
  $("busito").style.left = d.pos + "%";
  if (d.escena) setTimeout(() => setEscena(d.escena), 1500);
  if (d.llegada) {
    setTimeout(() => setEscena("costa"), 1200);
    setTimeout(() => setEscena("noche"), 3600);
  }
  setTimeout(() => { e.classList.add("parado"); parada(i); }, DUR);
}

function explosion(){
  const caja = $("caja");
  const cx = caja.offsetLeft + caja.offsetWidth / 2, cy = caja.offsetTop + 20;
  const colores = ["#c0532f", "#e8a33d", "#ffffff", "#4f7a5c"];
  for (let n = 0; n < 40; n++) {
    const p = document.createElement("span");
    p.className = "chispa";
    p.textContent = n % 3 ? "♥" : "✦";
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 180;
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    p.style.color = colores[n % 4];
    p.style.fontSize = 12 + Math.random() * 18 + "px";
    $("escena").appendChild(p);
    setTimeout(() => p.remove(), 1900);
  }
}

function lluvia(){
  const colores = ["#c0532f", "#4f7a5c", "#e8a33d"];
  for (let n = 0; n < 46; n++) {
    const s = document.createElement("span");
    s.className = "lluvia";
    s.textContent = n % 4 ? "♥" : "🍼";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 14 + Math.random() * 20 + "px";
    s.style.color = colores[n % 3];
    s.style.animationDuration = 3 + Math.random() * 3 + "s";
    s.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 9500);
  }
}

function final(){
  const dias = Math.ceil((new Date(C.fechaParto + "T00:00:00") - new Date()) / 864e5);
  const wa = "https://wa.me/" + C.whatsapp + "?text=";
  $("panel").innerHTML = `<p class="lugar">📦 La encomienda</p>
    <figure class="foto eco"><img src="ecografia.jpg" alt=""><figcaption>Alguien viene en camino</figcaption></figure>
    <h1 class="tio">¡Vas a ser tío!</h1>
    <p class="sub">${C.yo} y ${C.novia} vamos a ser papás.<br>Y ${C.perro} va a ser hermano mayor.</p>
    <p class="cuenta">Llega en ${C.mesParto}${dias > 0 ? ` · faltan unos ${dias} días` : ""}</p>
    <div class="carta">${t(C.carta)}</div>
    <p class="firma">Tu ${C.yo}, ${C.novia} y ${C.perro}</p>
    <p class="preg">¿Qué crees que será?</p>
    <a class="btn" target="_blank" rel="noopener" href="${wa + encodeURIComponent("¡Ya abrí la encomienda! 😭💛 Yo digo que será niño 💙")}">Niño 💙</a>
    <a class="btn" target="_blank" rel="noopener" href="${wa + encodeURIComponent("¡Ya abrí la encomienda! 😭💛 Yo digo que será niña 💗")}">Niña 💗</a>
    <p><button class="btn sec" id="otra">Ver de nuevo</button></p>`;
  $("otra").onclick = () => location.reload();
  lluvia();
  $("panel").scrollIntoView({behavior: "smooth", block: "start"});
}

$("caja").onclick = () => {
  const c = $("caja");
  if (c.classList.contains("abierta")) return;
  c.classList.add("abierta");
  explosion();
  if (navigator.vibrate) navigator.vibrate([80, 60, 160]);
  setTimeout(final, 1300);
};

$("subir").onclick = () => {
  $("musica").play().catch(() => {});
  $("intro").remove();
  $("viaje").classList.remove("oculto");
  setEscena("sierra");
  parada(0);
};
</script>
</body>
</html>
